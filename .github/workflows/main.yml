name: Deploy Storybook (multi-branch)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # ================= MAIN =================
      - name: Install main
        working-directory: main
        run: yarn install

      - name: Build main
        working-directory: main
        run: yarn build-storybook -o ../out/main

      # ================= DEVELOP =================
      - name: Install develop
        working-directory: develop
        run: yarn install

      - name: Build develop
        working-directory: develop
        run: yarn build-storybook -o ../out/develop

      # ================= ROOT ROUTING SETUP =================
      - name: Prepare final deploy structure
        run: |
          rm -rf out
          mkdir -p out

          # / (root) = main
          cp -r main/storybook-static/* out/

          # /main = main (explicit route)
          mkdir -p out/main
          cp -r main/storybook-static/* out/main

          # /develop = develop
          mkdir -p out/develop
          cp -r develop/storybook-static/* out/develop

      # ================= UPLOAD =================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4