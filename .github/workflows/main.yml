name: Deploy Storybook

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - run: yarn install

      - name: Build Storybook
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            yarn build-storybook -- -o storybook-static
          else
            yarn build-storybook -- -o storybook-static/develop
          fi

      - name: Prepare output
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            mkdir -p out
            mv storybook-static/* out/
          else
            mkdir -p out/develop
            mv storybook-static/develop/* out/develop/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4