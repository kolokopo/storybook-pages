name: Deploy Storybook (multi-branch)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      # =========================
      # BUILD MAIN
      # =========================
      - name: Install deps (main)
        working-directory: main
        run: yarn install

      - name: Build main Storybook
        working-directory: main
        run: yarn build-storybook -o ../out/main
        env:
          STORYBOOK_BASE_PATH: /storybook-pages/main/

      # =========================
      # BUILD DEVELOP
      # =========================
      - name: Install deps (develop)
        working-directory: develop
        run: yarn install

      - name: Build develop Storybook
        working-directory: develop
        run: yarn build-storybook -o ../out/develop
        env:
          STORYBOOK_BASE_PATH: /storybook-pages/develop/

      # =========================
      # DEPLOY
      # =========================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4